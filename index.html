<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BR Test">
    <meta name="theme-color" content="#000000">
    <title>BR Test - PDV</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzAwMDAwMCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxODAiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSIjRkFDQzE1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjM1ZW0iPkJSPC90ZXh0Pjwvc3ZnPg==">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header id="main-header">
        <h1>BR <span class="text-yellow">TEST</span></h1>
        <p id="status-caixa">Caixa Fechado</p>
        <button class="btn-download-discreto" onclick="abrirModalDownloads()" title="Baixar o App">⬇️</button>
    </header>

    <main id="app-container"></main>

    <!-- MODAL DE AVISOS -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-titulo">Aviso</h3>
            <p id="modal-mensagem">Mensagem aqui</p>
            <div class="modal-botoes">
                <button id="modal-btn-cancelar" class="btn-neutro" onclick="fecharModal()">Cancelar</button>
                <button id="modal-btn-confirmar" class="btn-primario" onclick="confirmarModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE DOWNLOADS -->
    <div id="modal-downloads" class="modal-overlay">
        <div class="modal-box">
            <h3>⬇️ Baixar o App</h3>
            <p style="font-size: 0.85rem; color: #A3A3A3; text-align: center; margin-bottom: 0.5rem;">
                Escolha a plataforma para instalar em outro dispositivo
            </p>
            
            <a id="link-download-windows" href="#" class="btn-download-plataforma" target="_blank">
                <span style="font-size: 1.5rem;">🪟</span>
                <div>
                    <div style="font-weight: 700;">Windows</div>
                    <div style="font-size: 0.75rem; color: #A3A3A3;">Arquivo .exe</div>
                </div>
            </a>
            
            <a id="link-download-android" href="#" class="btn-download-plataforma" target="_blank">
                <span style="font-size: 1.5rem;">🤖</span>
                <div>
                    <div style="font-weight: 700;">Android</div>
                    <div style="font-size: 0.75rem; color: #A3A3A3;">Arquivo .apk</div>
                </div>
            </a>
            
            <a id="link-download-ios" href="#" class="btn-download-plataforma" target="_blank">
                <span style="font-size: 1.5rem;">🍏</span>
                <div>
                    <div style="font-weight: 700;">iPhone / iPad</div>
                    <div style="font-size: 0.75rem; color: #A3A3A3;">Arquivo .ipa</div>
                </div>
            </a>
            
            <button onclick="fecharModalDownloads()" class="btn-neutro" style="margin-top: 0.5rem;">Fechar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => {
                        console.log('✅ Service Worker registrado:', reg.scope);
                        reg.update();
                    })
                    .catch((err) => console.error('❌ Erro no Service Worker:', err));
            });
        }
    </script>
</body>
</html>
