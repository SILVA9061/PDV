<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<title>BR Test PDV</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div class="app-wrapper">
    <!-- SIDEBAR PC -->
    <aside class="pc-sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">BR <span>TEST</span></div>
            <span class="sidebar-tag fechado" id="sidebar-tag">FECHADO</span>
        </div>

        <div class="sidebar-operador">
            <div class="sidebar-avatar">👤</div>
            <div class="sidebar-operador-info">
                <span class="sidebar-operador-nome" id="sidebar-operador-nome">—</span>
                <span class="sidebar-operador-label">Operador</span>
            </div>
        </div>

        <div class="sidebar-gaveta" id="sidebar-gaveta">
            <span class="gaveta-icone">💵</span>
            <div class="gaveta-info">
                <span class="gaveta-valor-header" id="sidebar-gaveta-valor">R$ 0,00</span>
                <span class="gaveta-label">Na gaveta</span>
            </div>
        </div>

        <nav class="sidebar-menu" id="sidebar-menu"></nav>

        <div class="sidebar-rodape">
            <div class="sidebar-relogio" id="sidebar-relogio">--:--:--</div>
            <button class="sidebar-btn-download" onclick="abrirModalDownloads()">📥 Baixar App</button>
            <button class="sidebar-btn-fechar" id="sidebar-btn-fechar" onclick="renderizarTelaFecharCaixa()" disabled>🔒 Fechar Caixa</button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="app-main">
        <!-- HEADER MOBILE -->
        <header class="mobile-header" id="mobile-header">
            <div class="header-topo">
                <div class="header-logo-wrap">
                    <h1>BR <span class="text-yellow">TEST</span></h1>
                    <span class="header-tag fechado" id="header-tag">FECHADO</span>
                </div>
                <div class="header-direita">
                    <span class="relogio" id="relogio">--:--</span>
                    <button class="btn-download-discreto" onclick="abrirModalDownloads()">⬇</button>
                </div>
            </div>
            <div class="header-status">
                <span class="header-operador" id="header-operador">—</span>
                <span class="gaveta-chip" id="header-gaveta" style="display:none;">
                    💵 <span class="valor" id="header-gaveta-valor">R$ 0,00</span>
                </span>
            </div>
        </header>

        <div id="app-container" class="app-main"></div>
    </div>
</div>

<!-- MODAIS -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-titulo">Aviso</h3>
        <p id="modal-mensagem">Mensagem aqui</p>
        <div class="modal-botoes">
            <button class="btn-neutro" id="modal-btn-cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="btn-primario" id="modal-btn-confirmar" onclick="confirmarModal()">OK</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-valor">
    <div class="modal-box">
        <h3 id="modal-valor-titulo">Informe o valor</h3>
        <p class="modal-produto-nome" id="modal-valor-produto">Produto</p>
        <input type="number" id="modal-valor-input" class="input-grande" step="0.01" placeholder="0,00">
        <div class="modal-botoes">
            <button class="btn-neutro" onclick="fecharModalValor()">Cancelar</button>
            <button class="btn-primario" onclick="confirmarValorProduto()">Confirmar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-seletor">
    <div class="modal-box">
        <h3 id="seletor-titulo">Escolha</h3>
        <div id="seletor-opcoes" class="seletor-opcoes"></div>
        <div class="modal-botoes">
            <button class="btn-neutro" onclick="fecharSeletor()">Fechar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-downloads">
    <div class="modal-box">
        <h3>📥 Baixar o App</h3>
        <p class="modal-subtitulo">Escolha a versão para o seu dispositivo</p>
        <a id="link-download-windows" class="btn-download-plataforma" href="#">
            <div class="plat-icone plat-windows">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5L10.5 4.4v7.1H3V5.5zm0 13l7.5 1.1v-7H3v5.9zm9-14.4L21 3v8.5h-9V4.1zm0 15.6L21 21v-8.5h-9v7.6z"/></svg>
            </div>
            <div>
                <div class="plat-nome">Windows</div>
                <div class="plat-desc">Instalador .exe</div>
            </div>
        </a>
        <a id="link-download-android" class="btn-download-plataforma" href="#">
            <div class="plat-icone plat-android">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.5 11.5 0 0 0-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48C3.3 11.25 1.28 14.44 1 18h22c-.28-3.56-2.3-6.75-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>
            </div>
            <div>
                <div class="plat-nome">Android</div>
                <div class="plat-desc">Arquivo .apk</div>
            </div>
        </a>
        <button class="btn-download-plataforma desabilitado" onclick="avisarIOSEmBreve()">
            <span class="plat-badge-breve">EM BREVE</span>
            <div class="plat-icone plat-ios">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            </div>
            <div>
                <div class="plat-nome">iOS</div>
                <div class="plat-desc">iPhone / iPad</div>
            </div>
        </button>
        <div class="modal-botoes">
            <button class="btn-neutro" onclick="fecharModalDownloads()">Fechar</button>
        </div>
    </div>
</div>

<div class="modal-catalogo" id="modal-catalogo">
    <div class="catalogo-header">
        <h3>📚 Catálogo</h3>
        <button class="btn-fechar-catalogo" onclick="fecharCatalogo()">✕</button>
    </div>
    <div class="catalogo-busca-wrapper">
        <input type="text" class="input-grande" id="catalogo-busca" placeholder="🔍 Buscar produto...">
    </div>
    <div class="catalogo-tabs-wrapper" id="catalogo-tabs"></div>
    <div class="catalogo-lista" id="catalogo-lista"></div>
</div>

<div class="modal-overlay" id="modal-detalhe-vendedor">
    <div class="modal-box" id="detalhe-vendedor-conteudo"></div>
</div>

<script src="app.js"></script>
</body>
</html>
